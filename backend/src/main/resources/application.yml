spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/forumhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  error.include-message: never
app:
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: 30
    refresh-days: 14
