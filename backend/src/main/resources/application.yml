spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/forumhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error.include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForLocalDevMustBeAtLeast32BytesLong123456}
    access-minutes: ${JWT_EXPIRATION_MINUTES:30}
    refresh-days: 14
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.onrender.com}
